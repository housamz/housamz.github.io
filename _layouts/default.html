<html lang="{{ site.locale | slice: 0,2 | default: 'en' }}" class="no-js">

<head>
  {% include head.html %}
</head>

<body class="bg-white font-sans text-gray-800 antialiased dark:bg-[#0b0f16] dark:text-gray-100">
  <div class="mx-auto flex max-w-5xl px-4 pb-20 pt-8 md:pt-20 lg:pt-32 max-md:block">
    {% include header.html %}
    <main class="min-w-0 flex-auto">
      <h1 class="mb-16 hidden min-h-12 text-base font-extrabold uppercase leading-tight md:flex items-center">
        <a class="text-gray-800 no-underline hover:text-sky-700 dark:text-gray-100 dark:hover:text-sky-300" href="{{ site.baseurl }}/">{{ site.name }}</a>
      </h1>
      <div class="w-full" id="main">{{ content }}</div>
      {% include footer.html %}
    </main>
  </div>
</body>

</html>
