---
layout: page
title: Tags
---

{% assign list = site.tags | sort %}

<div class="tags-expo">
  <div class="tags-expo-list">
    {% for tag in list %}
    <a href="#{{ tag[0] | slugify }}" class="post-tag">{{ tag[0] }}</a>
    {% endfor %}
  </div>
  <div class="grid grid-cols-1 gap-3 sm:grid-cols-2 lg:grid-cols-3">
    {% for tag in list %}
    <div class="border border-[var(--border)]">
      <h4
        id="{{ tag[0] | slugify }}tag"
        class="bg-sky-700 text-white p-2 font-bold"
      >
        {{ tag[0] }}
      </h4>
      <ul class="list-inside list-disc text-sm text-[var(--muted)] p-4">
        {% for post in tag[1] %}
        <li>
          <a href="{{ post.url | relative_url }}">{{ post.title }}</a>
        </li>
        {% endfor %}
      </ul>
    </div>
    {% endfor %}
  </div>
</div>
