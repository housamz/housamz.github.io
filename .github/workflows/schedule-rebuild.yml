name: Scheduled Jekyll Rebuild

on:
  schedule:
    # Runs auto build every day at 8:00 AM UTC
    - cron: '0 8 * * *'
  workflow_dispatch: # Keeps a manual trigger button available

jobs:
  request-rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger GitHub Pages Build
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.repos.requestPagesBuild({
              owner: context.repo.owner,
              repo: context.repo.repo
            });
